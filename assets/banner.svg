<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Imam Hossen — Full Stack Developer</title>
  <desc id="d">Profile banner for Imam Hossen, Full Stack Developer (Next.js, Node.js, TypeScript, PostgreSQL), on an animated circuit-board background.</desc>
  <defs>
    <style>
      .pulse { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 9 141; animation: flow 6s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 150; } to { stroke-dashoffset: 0; } }
      .pad { animation: padPulse 3.2s ease-in-out infinite; }
      @keyframes padPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      .gl { opacity: 0; animation: floatUp 10s linear infinite; }
      @keyframes floatUp {
        0% { opacity: 0; transform: translateY(12px); }
        25%, 75% { opacity: .42; }
        100% { opacity: 0; transform: translateY(-20px); }
      }
      .halo { animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 9s linear infinite; }
      @keyframes scan { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pad, .gl, .halo, .caret, .scan { animation: none; }
        .gl { opacity: .3; }
      }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".1"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0d1117" stop-opacity=".96"/><stop offset=".62" stop-color="#0d1117" stop-opacity=".8"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".34"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="300">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="300"><feGaussianBlur stdDeviation="11"/></filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="260" height="300" fill="url(#scanG)"/>

    <!-- circuit board -->
    <g fill="none" stroke="#58a6ff" stroke-opacity=".22" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 20H200L220 40H380"/><path d="M0 50H120L150 80H250"/><path d="M0 110H70L100 140H210L230 160H280"/><path d="M0 190H110L140 220H240"/><path d="M0 250H170L190 270H360"/><path d="M1000 15H780L760 35H620"/><path d="M1000 40H860L830 70H740"/><path d="M1000 100H930L900 130H790L770 150H725"/><path d="M1000 180H900L870 210H760"/><path d="M1000 240H850L820 270H640"/><path d="M150 140V166"/><path d="M60 190V212"/><path d="M300 40V62"/><path d="M850 130V106"/><path d="M940 180V158"/><path d="M700 35V56"/><path d="M110 250V232"/><path d="M900 240V262"/></g>
    <g filter="url(#neon)"><path class="pulse" d="M0 20H200L220 40H380" pathLength="100" stroke="#58a6ff" style="animation-duration:6.5s;animation-delay:-0.0s"/><path class="pulse" d="M0 50H120L150 80H250" pathLength="100" stroke="#3fb950" style="animation-duration:5.0s;animation-delay:-1.4s"/><path class="pulse" d="M0 110H70L100 140H210L230 160H280" pathLength="100" stroke="#58a6ff" style="animation-duration:5.8s;animation-delay:-0.6s"/><path class="pulse" d="M0 190H110L140 220H240" pathLength="100" stroke="#bc8cff" style="animation-duration:5.2s;animation-delay:-2.3s"/><path class="pulse" d="M0 250H170L190 270H360" pathLength="100" stroke="#58a6ff" style="animation-duration:6.8s;animation-delay:-3.1s"/><path class="pulse" d="M1000 15H780L760 35H620" pathLength="100" stroke="#bc8cff" style="animation-duration:6.6s;animation-delay:-1.0s"/><path class="pulse" d="M1000 40H860L830 70H740" pathLength="100" stroke="#58a6ff" style="animation-duration:5.1s;animation-delay:-2.6s"/><path class="pulse" d="M1000 100H930L900 130H790L770 150H725" pathLength="100" stroke="#3fb950" style="animation-duration:5.9s;animation-delay:-0.2s"/><path class="pulse" d="M1000 180H900L870 210H760" pathLength="100" stroke="#58a6ff" style="animation-duration:5.3s;animation-delay:-3.4s"/><path class="pulse" d="M1000 240H850L820 270H640" pathLength="100" stroke="#58a6ff" style="animation-duration:6.9s;animation-delay:-1.8s"/></g>
    <g class="pad" style="animation-delay:-0.0s"><circle cx="380" cy="40" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="380" cy="40" r="1.6" fill="#58a6ff"/></g><g class="pad" style="animation-delay:-1.4s"><circle cx="250" cy="80" r="4.5" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/><circle cx="250" cy="80" r="1.6" fill="#3fb950"/></g><g class="pad" style="animation-delay:-0.6s"><circle cx="280" cy="160" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="280" cy="160" r="1.6" fill="#58a6ff"/></g><g class="pad" style="animation-delay:-2.3s"><circle cx="240" cy="220" r="4.5" fill="#0d1117" stroke="#bc8cff" stroke-width="1.4"/><circle cx="240" cy="220" r="1.6" fill="#bc8cff"/></g><g class="pad" style="animation-delay:-3.1s"><circle cx="360" cy="270" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="360" cy="270" r="1.6" fill="#58a6ff"/></g><g class="pad" style="animation-delay:-1.0s"><circle cx="620" cy="35" r="4.5" fill="#0d1117" stroke="#bc8cff" stroke-width="1.4"/><circle cx="620" cy="35" r="1.6" fill="#bc8cff"/></g><g class="pad" style="animation-delay:-2.6s"><circle cx="740" cy="70" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="740" cy="70" r="1.6" fill="#58a6ff"/></g><g class="pad" style="animation-delay:-0.2s"><circle cx="725" cy="150" r="4.5" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/><circle cx="725" cy="150" r="1.6" fill="#3fb950"/></g><g class="pad" style="animation-delay:-3.4s"><circle cx="760" cy="210" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="760" cy="210" r="1.6" fill="#58a6ff"/></g><g class="pad" style="animation-delay:-1.8s"><circle cx="640" cy="270" r="4.5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.4"/><circle cx="640" cy="270" r="1.6" fill="#58a6ff"/></g><circle cx="150" cy="166" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="60" cy="212" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="300" cy="62" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="850" cy="106" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="940" cy="158" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="700" cy="56" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="110" cy="232" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/><circle cx="900" cy="262" r="2.6" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".45" stroke-width="1.1"/>

    <!-- floating code glyphs -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#58a6ff"><text class="gl" style="animation-duration:9s;animation-delay:-0s" x="44" y="92">&lt;/&gt;</text><text class="gl" style="animation-duration:11s;animation-delay:-3.5s" x="196" y="122">{ }</text><text class="gl" style="animation-duration:8s;animation-delay:-5.2s" x="40" y="172">=&gt;</text><text class="gl" style="animation-duration:10s;animation-delay:-1.7s" x="268" y="252">01</text><text class="gl" style="animation-duration:12s;animation-delay:-6.1s" x="452" y="290">git</text><text class="gl" style="animation-duration:10s;animation-delay:-2.4s" x="936" y="76">( )</text><text class="gl" style="animation-duration:9s;animation-delay:-4.6s" x="792" y="104">[ ]</text><text class="gl" style="animation-duration:11s;animation-delay:-0.9s" x="944" y="218">&amp;&amp;</text><text class="gl" style="animation-duration:8s;animation-delay:-3.0s" x="716" y="250">//</text><text class="gl" style="animation-duration:12s;animation-delay:-7.3s" x="548" y="26">npm</text><text class="gl" style="animation-duration:10s;animation-delay:-4.0s" x="472" y="22">10</text><text class="gl" style="animation-duration:11s;animation-delay:-2.0s" x="560" y="288">API</text></g>

    <!-- centre -->
    <ellipse cx="500" cy="160" rx="330" ry="150" fill="url(#core)"/>
    <ellipse class="halo" cx="500" cy="150" rx="300" ry="95" fill="url(#glow)"/>

    <text x="500" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><tspan fill="#3fb950">$</tspan><tspan fill="#8b949e"> whoami</tspan></text>
    <text class="halo" x="500" y="164" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1" fill="#58a6ff" filter="url(#soft)">Imam Hossen</text>
    <text x="500" y="164" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#name)">Imam Hossen</text>
    <text x="381.2" y="206" textLength="237.6" lengthAdjust="spacing" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600"><tspan fill="#8b949e">&lt;</tspan><tspan fill="#7ee787">FullStackDeveloper</tspan><tspan fill="#8b949e"> /&gt;</tspan></text>
    <rect class="caret" x="624.8" y="191" width="9" height="18" rx="1" fill="#58a6ff"/>
    <text x="500" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8b949e" letter-spacing=".6">Next.js <tspan fill="#58a6ff" fill-opacity=".6">//</tspan> Node.js <tspan fill="#58a6ff" fill-opacity=".6">//</tspan> TypeScript <tspan fill="#58a6ff" fill-opacity=".6">//</tspan> PostgreSQL</text>

    <rect x=".5" y=".5" width="999" height="299" rx="15.5" fill="none" stroke="#30363d"/>
  </g>
</svg>
