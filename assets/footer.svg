<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-labelledby="t">
  <title id="t">Code is not just syntax — it's a craft, a conversation, and a commitment. Thanks for visiting.</title>
  <defs>
    <style>
      .pulse { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 12 138; animation: flow 5s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 150; } to { stroke-dashoffset: 0; } }
      .pad { animation: padPulse 3.2s ease-in-out infinite; }
      @keyframes padPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      .gl { opacity: 0; animation: floatUp 10s linear infinite; }
      @keyframes floatUp { 0% { opacity: 0; transform: translateY(10px); } 25%, 75% { opacity: .42; } 100% { opacity: 0; transform: translateY(-16px); } }
      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 9s linear infinite; }
      @keyframes scan { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .pad, .gl, .caret, .scan { animation: none; } .gl { opacity: .3; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#090e18"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".1"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".07"/></pattern>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="140">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="140" rx="16"/></clipPath>
  </defs>
